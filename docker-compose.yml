services:
  db:
    container_name: postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      PGDATA: /data/postgres
      POSTGRES_DB: novaecommercedb
    volumes:
      - db:/data/postgres
    ports:
      - 5433:5432
    networks:
      - db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
networks:
  db:
    driver: bridge

volumes:
  db: